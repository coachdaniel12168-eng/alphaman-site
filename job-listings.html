<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Listings — AlphaMan</title>
<style>
:root { --primary: #2563eb; --dark: #1e293b; --light: #f8fafc; --orange: #ea580c; --teal: #0d9488; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--light); color:var(--dark); display:flex; flex-direction:column; min-height:100vh; line-height:1.7; }
.header { background:var(--dark); color:white; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; flex-shrink:0; }
.header .logo { font-size:1.3em; font-weight:700; color:var(--primary); text-decoration:none; }
.header nav { display:flex; gap:24px; }
.header nav a { color:#cbd5e1; text-decoration:none; font-size:.9em; }
.header nav a:hover { color:white; }
.main { flex:1; padding:60px 24px; max-width:1000px; margin:0 auto; width:100%; }
h1 { font-size:2em; margin-bottom:8px; }
.subtitle { color:#64748b; margin-bottom:24px; }
.filters { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.filters select, .filters input { padding:10px 14px; border:2px solid #e2e8f0; border-radius:8px; font-size:.9em; font-family:inherit; }
.job-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; }
.job-card { background:white; border-radius:12px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); position:relative; }
.job-card.expired { opacity:0.5; pointer-events:none; }
.job-card h3 { margin-bottom:4px; }
.job-card .company { color:var(--primary); font-weight:600; font-size:.9em; margin-bottom:8px; }
.job-card .meta { font-size:.85em; color:#64748b; margin-bottom:6px; }
.job-card .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:.75em; font-weight:600; }
.badge-active { background:#d1fae5; color:#065f46; }
.badge-closing { background:#fff3cd; color:#856404; }
.badge-expired { background:#fee2e2; color:#991b1b; }
.badge-urgent { background:#fce7f3; color:#9d174d; }
.btn { display:inline-block; padding:10px 22px; background:var(--orange); color:white; text-decoration:none; border-radius:8px; font-weight:600; font-size:.9em; margin-top:12px; }
.footer { background:var(--dark); color:#94a3b8; text-align:center; padding:20px 24px; font-size:.85em; flex-shrink:0; }
.footer a { color:var(--primary); text-decoration:none; margin:0 8px; }
.counter { background:var(--primary); color:white; padding:6px 14px; border-radius:20px; font-size:.85em; font-weight:600; display:inline-block; margin-bottom:20px; }
</style>
</head>
<body>
<header class="header">
  <a href="./" class="logo">AlphaMan</a>
  <nav>
    <a href="./">Home</a>
    <a href="hire.html">Hire Talent</a>
    <a href="job-listings.html">Jobs</a>
    <a href="submit-cv.html">Submit CV</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy.html">Privacy</a>
  </nav>
</header>

<main class="main">
<h1>Enterprise Job Board</h1>
<p class="subtitle">All listings auto-expire based on close date. Expired jobs are automatically filtered from active views.</p>

<div class="filters">
  <select id="filterIndustry"><option value="all">All Industries</option><option>Technology</option><option>Financial Services</option><option>Enterprise Software</option><option>Digital Banking</option><option>Manufacturing</option></select>
  <select id="filterRole"><option value="all">All Roles</option><option>Engineering</option><option>Operations</option><option>Sales</option><option>Finance</option><option>Executive</option></select>
  <select id="filterStatus"><option value="all">All Status</option><option value="active">Active Only</option><option value="expired">Expired</option></select>
</div>

<span class="counter" id="jobCount">Loading...</span>

<div class="job-grid" id="jobGrid"></div>
</main>

<footer class="footer">
  AlphaMan — AI-Vetted Talent Solutions &copy; 2026 &nbsp;|&nbsp;
  <a href="privacy.html">Privacy</a> <a href="terms.html">Terms</a>
</footer>

<script>
const now = new Date();

// Job database with real expiration timestamps
const jobs = [
  { id:1, title:"Senior AI Engineer", company:"TechScale Singapore", industry:"Technology", role:"Engineering", location:"Singapore (Hybrid)", salary:"$150K–$200K SGD", closeDate:"2026-07-15", urgent:true, desc:"Lead ML pipeline development. PyTorch, MLOps, distributed systems." },
  { id:2, title:"Director of Corporate Operations", company:"Asia Pacific Bank", industry:"Financial Services", role:"Operations", location:"Singapore (CBD)", salary:"$200K–$280K SGD", closeDate:"2026-07-30", urgent:false, desc:"Regional operations across APAC. 12+ years leadership." },
  { id:3, title:"VP Enterprise Sales (APAC)", company:"CloudBase", industry:"Enterprise Software", role:"Sales", location:"Singapore (Regional)", salary:"$220K–$320K SGD + OTE", closeDate:"2026-06-25", urgent:true, desc:"Build APAC enterprise sales. $5M+ quota experience." },
  { id:4, title:"Head of Risk & Compliance", company:"NeoPay Digital Bank", industry:"Digital Banking", role:"Finance", location:"Singapore", salary:"$180K–$240K SGD", closeDate:"2026-08-01", urgent:false, desc:"Lead compliance for licensed digital bank. MAS expertise." },
  { id:5, title:"Cloud Solutions Architect", company:"DataBridge", industry:"Technology", role:"Engineering", location:"Singapore (Remote)", salary:"$160K–$210K SGD", closeDate:"2026-06-15", urgent:false, desc:"AWS/Azure/GCP architecture. Terraform, Kubernetes." },
  { id:6, title:"Chief Financial Officer", company:"GreenLeaf Manufacturing", industry:"Manufacturing", role:"Executive", location:"Johor Bahru (Regional)", salary:"$250K–$350K SGD", closeDate:"2026-07-10", urgent:true, desc:"CFO for regional manufacturer. IPO-ready experience preferred." },
  { id:7, title:"Quantitative Trader", company:"Meridian Capital", industry:"Financial Services", role:"Finance", location:"Singapore", salary:"$180K–$350K+ SGD", closeDate:"2026-06-01", urgent:false, desc:"Prop trading desk. Python, C++, market microstructure." },
  { id:8, title:"Head of HR Transformation", company:"Pacific Retail Group", industry:"Manufacturing", role:"Operations", location:"Singapore", salary:"$170K–$220K SGD", closeDate:"2026-08-15", urgent:false, desc:"HR transformation across 3,000+ workforce. HRIS implementation." }
];

function getDaysLeft(closeDate) {
  const close = new Date(closeDate);
  const diff = Math.ceil((close - now) / (1000 * 60 * 60 * 24));
  return diff;
}

function getStatus(job) {
  const days = getDaysLeft(job.closeDate);
  if (days < 0) return 'expired';
  if (days <= 5) return 'closing';
  if (job.urgent) return 'urgent';
  return 'active';
}

function renderJobs() {
  const industry = document.getElementById('filterIndustry').value;
  const role = document.getElementById('filterRole').value;
  const status = document.getElementById('filterStatus').value;
  
  let filtered = jobs;
  if (industry !== 'all') filtered = filtered.filter(j => j.industry === industry);
  if (role !== 'all') filtered = filtered.filter(j => j.role === role);
  
  // Auto-filter expired unless user explicitly wants to see them
  if (status === 'all') {
    // Show all but mark expired
  } else if (status === 'active') {
    filtered = filtered.filter(j => getDaysLeft(j.closeDate) >= 0);
  }
  // status === 'expired' shows only expired
  
  const activeCount = filtered.filter(j => getDaysLeft(j.closeDate) >= 0).length;
  document.getElementById('jobCount').textContent = `${activeCount} active jobs`;
  
  const grid = document.getElementById('jobGrid');
  grid.innerHTML = filtered.map(j => {
    const days = getDaysLeft(j.closeDate);
    const isExpired = days < 0;
    const st = getStatus(j);
    const badgeClass = st === 'expired' ? 'badge-expired' : st === 'closing' ? 'badge-closing' : st === 'urgent' ? 'badge-urgent' : 'badge-active';
    const badgeText = st === 'expired' ? 'EXPIRED' : st === 'closing' ? `${days}d left` : st === 'urgent' ? 'URGENT' : 'ACTIVE';
    const daysText = isExpired ? `Expired ${Math.abs(days)} days ago` : `${days} days remaining`;
    
    return `<div class="job-card${isExpired?' expired':''}">
      <span class="badge ${badgeClass}">${badgeText}</span>
      <h3>${j.title}</h3>
      <div class="company">${j.company}</div>
      <div class="meta">📍 ${j.location}</div>
      <div class="meta">💰 ${j.salary}</div>
      <div class="meta">⏰ ${daysText} · Closes ${j.closeDate}</div>
      <p style="font-size:.85em;color:#64748b;margin-top:8px">${j.desc}</p>
      ${isExpired ? '<p style="color:#991b1b;font-size:.85em;margin-top:8px">This position has closed. No longer accepting applications.</p>' : `<a href="submit-cv.html" class="btn">Apply via AlphaMan →</a>`}
    </div>`;
  }).join('');
}

document.getElementById('filterIndustry').addEventListener('change', renderJobs);
document.getElementById('filterRole').addEventListener('change', renderJobs);
document.getElementById('filterStatus').addEventListener('change', renderJobs);

renderJobs();
</script>
</body>
</html>
