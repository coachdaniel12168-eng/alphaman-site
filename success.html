<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — AlphaMan</title>
<style>
:root { --primary: #2563eb; --dark: #1e293b; --teal: #0d9488; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; color: #1e293b; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
.card { background: white; border-radius: 16px; padding: 60px 40px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); max-width: 500px; margin: 24px; }
.icon { font-size: 3em; margin-bottom: 16px; }
h1 { color: var(--teal); margin-bottom: 12px; font-size: 1.6em; }
p { color: #64748b; line-height: 1.6; margin-bottom: 24px; }
.btn { display: inline-block; padding: 12px 28px; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Thank You! Your Audit Request is Received.</h1>
  <p>AlphaMan is now analyzing your website. Your custom improvement report will be generated and emailed to you shortly.</p>
  <a href="/" class="btn">Back to AlphaMan</a>
</div>
</body>
</html>
