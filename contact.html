<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — AlphaMan</title>
<style>
:root { --primary: #2563eb; --dark: #1e293b; --light: #f8fafc; --orange: #ea580c; --teal: #0d9488; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--light); color:var(--dark); display:flex; flex-direction:column; min-height:100vh; line-height:1.7; }
.header { background:var(--dark); color:white; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; flex-shrink:0; }
.header .logo { font-size:1.3em; font-weight:700; color:var(--primary); text-decoration:none; }
.header nav { display:flex; gap:24px; }
.header nav a { color:#cbd5e1; text-decoration:none; font-size:.9em; }
.header nav a:hover { color:white; }
.main { flex:1; padding:60px 24px; max-width:650px; margin:0 auto; width:100%; }
h1 { font-size:2em; color:var(--dark); margin-bottom:8px; }
.subtitle { color:#64748b; margin-bottom:32px; font-size:1.05em; }
h2 { color:var(--primary); margin:28px 0 12px; font-size:1.3em; }
h3 { color:var(--dark); margin:20px 0 8px; }
p,li { color:#475569; margin-bottom:14px; }
ul,ol { margin:10px 0 20px 20px; }
.card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; margin:20px 0; }
.card { background:white; border-radius:12px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.card h3 { color:var(--dark); margin-bottom:6px; }
.card p { font-size:.9em; }
table { width:100%; border-collapse:collapse; margin:16px 0 24px; background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
th,td { padding:14px 16px; text-align:left; border-bottom:1px solid #e2e8f0; }
th { background:var(--dark); color:white; font-size:.9em; }
td { font-size:.95em; }
.btn { display:inline-block; padding:12px 28px; background:var(--orange); color:white; text-decoration:none; border-radius:8px; font-weight:600; margin-top:12px; }
.footer { background:var(--dark); color:#94a3b8; text-align:center; padding:20px 24px; font-size:.85em; flex-shrink:0; }
.footer a { color:var(--primary); text-decoration:none; margin:0 8px; }
</style>
</head>
<body>
<header class="header">
  <a href="./" class="logo">AlphaMan</a>
  <nav>
    <a href="./">Home</a>
    <a href="hire.html">Hire Talent</a>
    <a href="job-listings.html">Jobs</a>
    <a href="submit-cv.html">Submit CV</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy.html">Privacy</a>
  </nav>
</header>
<main class="main">

<h1>Contact AlphaMan</h1>
<p class="subtitle">For enterprise recruitment solutions, partnership inquiries, or general questions.</p>

<form id="contactForm" style="background:white;padding:32px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.06);">
  <div style="margin-bottom:16px;"><label style="display:block;font-weight:600;margin-bottom:5px;">Full Name</label><input type="text" placeholder="Your full name" required style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1em;font-family:inherit;"></div>
  <div style="margin-bottom:16px;"><label style="display:block;font-weight:600;margin-bottom:5px;">Work Email</label><input type="email" placeholder="you@company.com" required style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1em;font-family:inherit;"></div>
  <div style="margin-bottom:16px;"><label style="display:block;font-weight:600;margin-bottom:5px;">Corporate Phone</label><input type="tel" placeholder="+65 XXXX XXXX" style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1em;font-family:inherit;"></div>
  <div style="margin-bottom:16px;"><label style="display:block;font-weight:600;margin-bottom:5px;">Company Name</label><input type="text" placeholder="Your Company Ltd" required style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1em;font-family:inherit;"></div>
  <div style="margin-bottom:16px;"><label style="display:block;font-weight:600;margin-bottom:5px;">Hiring Volume / Fleet Size</label><select style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1em;font-family:inherit;"><option>1-5 hires per year</option><option>6-20 hires per year</option><option>21-50 hires per year</option><option>50+ hires per year</option></select></div>
  <div style="margin-bottom:16px;"><label style="display:block;font-weight:600;margin-bottom:5px;">Message</label><textarea rows="4" placeholder="Describe your recruitment requirements..." style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1em;font-family:inherit;resize:vertical;"></textarea></div>
  <button type="submit" class="btn" style="width:100%;cursor:pointer;">Send Inquiry</button>
</form>
</main>
<footer class="footer">
  AlphaMan — AI-Vetted Talent Solutions &copy; 2026 &nbsp;|&nbsp;
  <a href="privacy.html">Privacy</a> <a href="terms.html">Terms</a>
</footer>
</body>
</html>
